name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-seo-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, seo]
    timeout-minutes: 15
    env:
      DEPLOY_DIR: /srv/services/seo
    steps:
      - name: Sync working copy to origin/master
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch origin master
          git reset --hard origin/master

      - name: Build and restart services
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose up -d --build

      - name: Wait for health check
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          PORT=$(grep -E '^PORT=' .env 2>/dev/null | cut -d= -f2)
          PORT=${PORT:-3000}
          for i in $(seq 1 15); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null; then
              echo "Service healthy on port ${PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after deploy" >&2
          docker compose logs --since=5m app
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
