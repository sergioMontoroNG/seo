services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/seo
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - seo_data:/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: seo
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  seo_data:
